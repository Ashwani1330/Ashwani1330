name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # v3.34 (the latest published release)
      - uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Ashwani1330

          base: header, activity, community, repositories, metadata
          base_indepth: yes
          config_timezone: Asia/Kolkata

          # make totals less misleading
          repositories: 200
          repositories_batch: 50
          repositories_affiliations: owner
          repositories_forks: yes
          repositories_skipped: gsoc2026-Ashwani_Kumar

          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_ignored: html, css, shell, hlsl, shaderlab, wolfram language
          # The released action cannot clone private repositories in in-depth mode.
          plugin_languages_indepth: no

          # Disabled: v3.34 can crash when GitHub's contributor-stats API fails.
          plugin_lines: no

          # let the action fail properly
          plugins_errors_fatal: yes
          verify: yes

          # Retry once for transient API failures without repeating a long job 3 times.
          retries: 2
          retries_delay: 60

          # avoid experimental SVG optimization for now
          optimize: css, xml
